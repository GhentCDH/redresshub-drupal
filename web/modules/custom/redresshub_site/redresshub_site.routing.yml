redresshub_site.research_data_vocabularies:
  path: '/admin/research-data/vocabularies'
  defaults:
    _controller: '\Drupal\redresshub_site\Controller\ResearchDataController::vocabularies'
    _title: 'Choice lists'
  requirements:
    _permission: 'access taxonomy overview'
  options:
    _admin_route: TRUE

redresshub_site.edit_home:
  path: '/admin/home-page'
  defaults:
    _controller: '\Drupal\redresshub_site\Controller\HomeController::edit'
    _title: 'Edit the home page'
  requirements:
    _custom_access: '\Drupal\redresshub_site\Controller\HomeController::access'
  options:
    _admin_route: TRUE

redresshub_site.explorer_panel:
  path: '/explorer/panel/{node}'
  defaults:
    _controller: '\Drupal\redresshub_site\Controller\ExplorerPanelController::panel'
  requirements:
    _entity_access: 'node.view'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
