id: nodegoat_organisation_fr
label: 'Nodegoat: French translations of the organisations'
migration_tags:
  - Nodegoat
source:
  plugin: nodegoat_objects
  type_id: 1601
  language: fr
process:
  nid:
    plugin: migration_lookup
    migration: nodegoat_organisation
    source: id
    no_stub: true
  langcode:
    plugin: default_value
    default_value: fr
  content_translation_source:
    plugin: default_value
    default_value: en
  title: name
destination:
  plugin: 'entity:node'
  default_bundle: organisation
  translations: true
migration_dependencies:
  required:
    - nodegoat_organisation
